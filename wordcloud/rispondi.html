<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Rispondi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #101834; --muted: #6b7290; --line: #dfe2ee;
    --accent: #4f46e5; --accent-dark: #4338ca; --err: #dc2626;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
  .label { font: 700 12px var(--font); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 8px 0 12px; }
  h1 { font-size: clamp(24px, 7vw, 32px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 28px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  .field { position: relative; }
  input {
    width: 100%; font: 600 20px var(--font); color: var(--ink);
    padding: 16px 64px 16px 16px; border: 2px solid var(--line); border-radius: 14px; outline: none;
    background: #fff; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  input.bad { border-color: var(--err); }
  .count { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 500 13px var(--font); color: var(--muted); }
  .msg { min-height: 20px; font: 500 14px var(--font); color: var(--err); }
  button {
    margin-top: 6px; font: 700 18px var(--font); color: #fff; background: var(--accent);
    border: 0; border-radius: 14px; padding: 16px; cursor: pointer; transition: background .15s, transform .05s;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: default; }

  .done { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding-bottom: 10vh; }
  .done.show { display: flex; }
  .check { width: 84px; height: 84px; border-radius: 50%; background: #ecfdf5; display: grid; place-items: center; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  .check svg { width: 44px; height: 44px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .done h2 { margin: 6px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .done p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .done .your { font-weight: 800; color: var(--accent); font-size: 22px; margin-top: 4px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="ask">
    <div class="label">Domanda</div>
    <h1 id="domanda">…</h1>
    <form id="form" autocomplete="off" novalidate>
      <div class="field">
        <input id="parola" name="parola" type="text" inputmode="text" enterkeyhint="send"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Scrivi una parola" maxlength="25" aria-label="La tua parola">
        <span class="count" id="count">0/25</span>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button id="invia" type="submit">Invia</button>
    </form>
  </div>

  <div class="done" id="done">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Grazie!</h2>
    <p>La tua risposta è stata inviata:</p>
    <div class="your" id="your"></div>
  </div>
</div>

<script>
let MAX = 25, sessione = null;
const $ = id => document.getElementById(id);
const input = $('parola'), msg = $('msg'), btn = $('invia');

function chiave() { return 'wordcloud-inviato-' + sessione; }
function mostraFatto(parola) {
  $('ask').classList.add('hide');
  $('your').textContent = parola;
  $('done').classList.add('show');
}

function errore(t) { msg.textContent = t; input.classList.toggle('bad', !!t); }

input.addEventListener('input', () => {
  // niente spazi: una parola sola
  if (/\s/.test(input.value)) {
    input.value = input.value.replace(/\s+/g, '');
    errore('Una sola parola, senza spazi 🙂');
  } else if (msg.textContent) errore('');
  $('count').textContent = `${input.value.length}/${MAX}`;
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const parola = input.value.trim();
  if (!parola) { errore('Scrivi una parola prima di inviare.'); input.focus(); return; }
  btn.disabled = true; btn.textContent = 'Invio…';
  try {
    const res = await fetch('api.php?azione=risposta', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ parola })
    });
    const r = await res.json();
    if (!res.ok) throw new Error(r.errore || 'Errore');
    try { localStorage.setItem('wordcloud-inviato-' + r.sessione, parola.toLowerCase()); } catch {}
    mostraFatto(parola.toLowerCase());
  } catch (err) {
    errore(err.message === 'Failed to fetch' ? 'Connessione assente: riprova.' : err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Invia';
  }
});

(async () => {
  try {
    const info = await (await fetch('api.php?azione=info', { cache: 'no-store' })).json();
    $('domanda').textContent = info.domanda;
    document.title = info.domanda;
    MAX = info.maxLen; input.maxLength = MAX; $('count').textContent = `0/${MAX}`;
    sessione = info.sessione;
    let gia = null;
    try { gia = localStorage.getItem(chiave()); } catch {}
    if (gia) mostraFatto(gia);
  } catch {
    $('domanda').textContent = 'Impossibile contattare il server.';
  }
})();
</script>
</body>
</html>
